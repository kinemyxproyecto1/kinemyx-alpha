<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>KINEMYX - Squat Alpha</title>

  <link
    rel="stylesheet"
    href="styles.css"
  />

  <!-- TensorFlow.js -->

  <script
    src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl">
  </script>

  <!-- MoveNet / Pose Detection -->

  <script
    src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection">
  </script>

</head>


<body>


<header>

  <div class="brand">

    KINEMY<span>X</span>

  </div>


  <div class="subtitle">

    Human Movement Intelligence

  </div>

</header>



<main>


  <!-- =========================
       CONFIGURACIÓN
  ========================== -->


  <section class="panel">


    <h2>
      Squat Analysis
    </h2>


    <div class="settings-grid">


      <!-- REPETICIONES -->

      <label>

        Repeticiones

        <input
          id="targetReps"
          type="number"
          value="8"
          min="1"
          max="50"
        />

      </label>



      <!-- FLEXIÓN RODILLA -->

      <label>

        Flexión objetivo

        <input
          id="kneeTarget"
          type="number"
          value="90"
          min="30"
          max="150"
        />

        <span>
          °
        </span>

      </label>



      <!-- TOLERANCIA ROM -->

      <label>

        Tolerancia ROM

        <input
          id="kneeTolerance"
          type="number"
          value="5"
          min="1"
          max="20"
        />

        <span>
          °
        </span>

      </label>



      <!-- EXCÉNTRICA -->

      <label>

        Excéntrica

        <input
          id="eccTarget"
          type="number"
          value="2"
          step="0.1"
        />

        <span>
          s
        </span>

      </label>



      <!-- TOLERANCIA EXCÉNTRICA -->

      <label>

        Tolerancia excéntrica

        <input
          id="eccTolerance"
          type="number"
          value="0.5"
          step="0.1"
        />

        <span>
          s
        </span>

      </label>



      <!-- CONCÉNTRICA -->

      <label>

        Concéntrica

        <input
          id="conTarget"
          type="number"
          value="1"
          step="0.1"
        />

        <span>
          s
        </span>

      </label>



      <!-- TOLERANCIA CONCÉNTRICA -->

      <label>

        Tolerancia concéntrica

        <input
          id="conTolerance"
          type="number"
          value="0.4"
          step="0.1"
        />

        <span>
          s
        </span>

      </label>



      <!-- FEEDBACK -->

      <label>

        Feedback

        <select id="feedbackMode">

          <option value="both">
            Visual + audio
          </option>

          <option value="visual">
            Solo visual
          </option>

          <option value="audio">
            Solo audio
          </option>

          <option value="off">
            Desactivado
          </option>

        </select>

      </label>


    </div>



    <!-- =========================
         VARIABLES A EVALUAR
    ========================== -->


    <h3>
      Evaluar
    </h3>


    <div class="checks">


      <label>

        <input
          id="checkRom"
          type="checkbox"
          checked
        >

        ROM

      </label>



      <label>

        <input
          id="checkEcc"
          type="checkbox"
          checked
        >

        Tempo excéntrico

      </label>



      <label>

        <input
          id="checkCon"
          type="checkbox"
          checked
        >

        Tempo concéntrico

      </label>


    </div>



    <!-- =========================
         BOTONES
    ========================== -->


    <div class="buttons">


      <!-- ACTIVAR CÁMARA -->

      <button
        id="cameraButton"
      >

        Activar cámara

      </button>



      <!-- NUEVO:
           CAMBIAR CÁMARA -->

      <button
        id="switchCameraButton"
        class="secondary"
      >

        Cambiar cámara

      </button>



      <!-- INICIAR -->

      <button
        id="startButton"
        disabled
      >

        Iniciar serie

      </button>



      <!-- MODIFICADO:
           YA NO ESTÁ DESHABILITADO -->

      <button
        id="stopButton"
        class="secondary"
      >

        Finalizar serie

      </button>


    </div>


  </section>



  <!-- =========================
       CÁMARA
  ========================== -->


  <section class="camera-section">


    <div class="camera-wrapper">


      <video
        id="video"
        autoplay
        muted
        playsinline
      >
      </video>


      <canvas
        id="canvas"
      >
      </canvas>


      <!-- ADVERTENCIA -->

      <div
        id="warning"
        class="warning hidden"
      >
      </div>


    </div>



    <!-- =========================
         PANEL EN VIVO
    ========================== -->


    <div class="live-panel">


      <div class="live-label">

        KINEMYX LIVE

      </div>



      <!-- REP -->

      <div class="metric">

        <small>
          REP
        </small>

        <strong id="repDisplay">

          0 / 8

        </strong>

      </div>



      <!-- FLEXIÓN -->

      <div class="metric">

        <small>
          KNEE FLEXION
        </small>

        <strong id="angleDisplay">

          —°

        </strong>

      </div>



      <!-- ESTADO -->

      <div class="metric">

        <small>
          STATE
        </small>

        <strong id="stateDisplay">

          READY

        </strong>

      </div>



      <!-- EXCÉNTRICA -->

      <div class="metric">

        <small>
          ECCENTRIC
        </small>

        <strong id="eccDisplay">

          —

        </strong>

      </div>



      <!-- CONCÉNTRICA -->

      <div class="metric">

        <small>
          CONCENTRIC
        </small>

        <strong id="conDisplay">

          —

        </strong>

      </div>



      <!-- LADO ACTIVO -->

      <div class="metric">

        <small>
          ACTIVE SIDE
        </small>

        <strong id="sideDisplay">

          —

        </strong>

      </div>



      <!-- ESTADO GENERAL -->

      <div
        id="status"
        class="status"
      >

        Activa la cámara

      </div>


    </div>


  </section>



  <!-- =========================
       RESULTADOS
  ========================== -->


  <section
    id="results"
    class="panel results"
  >


    <h2>

      Session Results

    </h2>



    <div
      id="summary"
      class="summary"
    >

      Aún no hay resultados.

    </div>



    <table>


      <thead>


        <tr>

          <th>
            Rep
          </th>

          <th>
            Rodilla
          </th>

          <th>
            Exc.
          </th>

          <th>
            Con.
          </th>

          <th>
            Estado
          </th>

        </tr>


      </thead>



      <tbody
        id="resultsBody"
      >
      </tbody>


    </table>


  </section>


</main>



<!-- =========================
     JAVASCRIPT
========================== -->


<script
  src="app.js">
</script>


</body>

</html>
